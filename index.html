<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160c20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kaosalter</title>
<style>
/* Grundlag */
:root{--bg:#160c20;--ink:#ece3d0;--dim:#a99bb8;--wax:#b0342f;--h:285;--oct:hsl(var(--h),80%,66%);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);scroll-snap-type:y mandatory}
body{margin:0;min-height:100vh;color:var(--ink);font:1.075rem/1.65 "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;background:radial-gradient(120% 60% at 50% 18%,#2b1640 0%,var(--bg) 62%) no-repeat,var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
section{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1.25rem;scroll-snap-align:start;scroll-snap-stop:always}
canvas:focus-visible,button:focus-visible,input:focus-visible,.deck:focus-visible,#hand:focus-visible{outline:2px solid var(--oct);outline-offset:4px}

/* Knapper og felter */
button{display:inline-grid;place-items:center;min-width:48px;min-height:44px;padding:.55rem 1.1rem;font:inherit;color:var(--oct);background:transparent;border:1px solid var(--dim);border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.main{background:var(--wax);border-color:var(--wax);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button:not(:disabled):active{border-color:var(--oct)}
input{width:min(100%,24rem);margin:.4rem 0 1rem;padding:.6rem 0;font:inherit;color:var(--oct);caret-color:var(--oct);text-shadow:0 0 8px var(--oct);background:transparent;border:0;border-bottom:1px solid var(--oct);border-radius:0}
input.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;width:min(100%,24rem)}

/* Navigation og lyd */
#dots{position:fixed;right:.2rem;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;z-index:5}
#dots button{width:28px;height:28px;min-width:0;min-height:0;padding:0;border:0;background:radial-gradient(circle,var(--dim) 3px,transparent 4px)}
#dots button.on{background:radial-gradient(circle,var(--oct) 4px,transparent 5px)}
#mute{position:fixed;left:.2rem;top:calc(.2rem + env(safe-area-inset-top));z-index:5;border:0;background:none}

/* Kaossfære og kaoskompas */
#sphere,#kompas{display:block;width:min(100%,76dvh);aspect-ratio:1;margin:0 auto;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
#sphere{border-radius:50%}

/* Sigil og ild */
#letters{min-height:1.7em;margin:.5rem 0 1rem;text-align:center;letter-spacing:.2em;font-size:1.15rem;color:var(--oct);text-shadow:0 0 8px var(--oct)}
#wrap{position:relative;width:min(100%,22rem,calc((100dvh - 14rem)/1.25));aspect-ratio:1/1.25}
#sigil{display:block;position:absolute;left:0;top:0;width:100%;aspect-ratio:1}
#sigil.burn{transition:opacity 2.4s ease-in,filter 2.4s ease-in;opacity:0;filter:sepia(1) saturate(5) hue-rotate(-35deg) blur(3px) brightness(1.5)}
#fire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Tarot */
#picker{display:flex;gap:.6rem;margin-bottom:1rem}
#picker button.on{border-color:var(--oct)}
#spread{--cw:min(62vw,15rem,calc(48dvh*.588));display:grid;gap:.5rem;justify-content:center;grid-auto-rows:calc(var(--cw)*1.7)}
#spread.s1{grid-template-columns:var(--cw)}
#spread.s3{--cw:min(calc((100vw - 3rem)/3.1),9rem,calc(40dvh*.588));grid-template-columns:repeat(3,var(--cw))}
#spread.s10{--cw:min(calc((100vw - 3rem)/4.6),6rem,calc((100dvh - 14rem)/7.2));grid-template-columns:repeat(4,var(--cw));gap:.35rem}
.deck{perspective:1200px;width:var(--cw);height:calc(var(--cw)*1.7);cursor:pointer;-webkit-tap-highlight-color:transparent}
.deck.x{transform:rotate(90deg);z-index:2}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{transform:rotateY(180deg)}
.face svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.face text{fill:var(--oct)}
#note{width:min(100%,22rem);min-height:6.5rem;margin-top:1.25rem;text-align:center;font-size:.95rem;line-height:1.5;color:var(--oct);text-shadow:0 0 8px var(--oct)}

/* Terninger */
.dice{display:flex;gap:1.5rem}
.die{width:min(34vw,9rem);aspect-ratio:1;min-height:0;padding:0;border:0;background:none}
.die svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 10px var(--oct))}
.die rect{fill:none;stroke:var(--oct);stroke-width:3}
.die circle{fill:var(--oct)}
.die.roll{animation:tumble .45s linear infinite}
.die.land svg{animation:land .8s ease-out}
@keyframes tumble{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.12)}100%{transform:rotate(360deg) scale(1)}}
@keyframes land{from{filter:drop-shadow(0 0 32px var(--oct)) brightness(2)}}

/* Tre ord */
#hand{width:min(100%,26rem);min-height:60dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;text-align:center;font-size:clamp(1.6rem,7.5vw,2.2rem);line-height:1.4;color:var(--oct);text-shadow:0 0 10px var(--oct);cursor:pointer;-webkit-tap-highlight-color:transparent}
#hand span{display:block;max-width:100%;overflow-wrap:anywhere}

@media (prefers-reduced-motion:reduce){
  input.shake,.die.roll,.die.land svg{animation:none}
  #sigil.burn{transition-duration:.01s}
  .card{transition:none}
}
</style>
</head>
<body>
<button id="mute" aria-label="Lyd"></button>
<nav id="dots"><button aria-label="Kaossfære"></button><button aria-label="Sigil"></button><button aria-label="Tarot"></button><button aria-label="Terninger"></button><button aria-label="Kaoskompas"></button><button aria-label="Ord"></button></nav>
<section>
  <canvas id="sphere" tabindex="0" role="button" aria-label="Kaossfære"></canvas>
</section>
<section>
  <input id="intent" type="text" maxlength="120" autocomplete="off" aria-label="Dit ønske">
  <div class="row">
    <button id="make" class="main" aria-label="Lav sigil" title="Lav sigil"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg></button>
    <button id="save" disabled aria-label="Gem billede" title="Gem billede"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button>
    <button id="burn" disabled aria-label="Brænd" title="Brænd"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg></button>
  </div>
  <div id="letters" aria-live="polite"></div>
  <div id="wrap"><canvas id="sigil" aria-label="Din sigil"></canvas><canvas id="fire"></canvas></div>
</section>
<section>
  <div id="picker">
    <button data-n="1" class="on" aria-label="Ét kort"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="1.5"/></svg></button>
    <button data-n="3" aria-label="Tre kort"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="6" width="6" height="12" rx="1"/><rect x="9" y="6" width="6" height="12" rx="1"/><rect x="16" y="6" width="6" height="12" rx="1"/></svg></button>
    <button data-n="10" aria-label="Keltisk kors"><svg viewBox="0 0 28 24" width="28" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="9" width="5" height="6"/><rect x="8" y="2" width="5" height="5"/><rect x="8" y="17" width="5" height="5"/><rect x="1" y="9" width="5" height="6"/><rect x="15" y="9" width="5" height="6"/><rect x="23" y="2" width="4" height="4"/><rect x="23" y="7" width="4" height="4"/><rect x="23" y="12" width="4" height="4"/><rect x="23" y="17" width="4" height="4"/></svg></button>
  </div>
  <div id="spread"></div>
  <div id="note" aria-live="polite"></div>
</section>
<section>
  <div class="dice"><button class="die" aria-label="Terning"></button><button class="die" aria-label="Terning"></button></div>
</section>
<section>
  <canvas id="kompas" role="button" aria-label="Kaoskompas"></canvas>
</section>
<section>
  <div id="hand" tabindex="0" role="button" aria-label="Tre ord"></div>
</section>

<script>
/* Kaosalter. Sider: kaossfære, sigil, tarot, terninger, kaoskompas, tre ord.
   Rækkefølge i filen: tilstand, kaossfære, sigil, ild, fuldskærm og sider, tarot,
   haptik, lyd, terninger (med gemt tilstand), kaoskompas, tre ord, start. */
(()=>{
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement;

/* ---------- Kaossfære ---------- */
const cv=$('#sphere'),cx=cv.getContext('2d');
let W=0,last=0,secIdx=0,sf=0,dc=0;
let charge=0,mood=null,mt=0,droneLp=null,wish='';   /* ladning, stemning fra kort, sidste sigils bogstaver */
let rot=0,base=reduce?0:.25,vel=base,pulse=0,hue=285,hueT=285;
const ripples=[];
let arrowN=8,trailA=.24,drift=10,fireOff=0,pitchMul=1;

function fit(canvas,ctx){
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=canvas.getBoundingClientRect().width;
  canvas.width=canvas.height=Math.round(w*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return w;
}

function draw(t){
  const c=W/2,R=W*.46;
  cx.globalCompositeOperation='destination-out';
  cx.fillStyle='rgba(0,0,0,'+(reduce?1:trailA)+')';
  cx.fillRect(0,0,W,W);
  cx.globalCompositeOperation='source-over';

  for(let i=ripples.length-1;i>=0;i--){
    const age=t-ripples[i];
    if(age>1.3){ripples.splice(i,1);continue}
    cx.strokeStyle='hsla('+(hue%360)+',85%,70%,'+(.55*(1-age/1.3))+')';
    cx.lineWidth=2;
    cx.beginPath();cx.arc(c,c,R*(.1+age*.75),0,6.2832);cx.stroke();
  }

  cx.save();cx.translate(c,c);cx.rotate(rot);
  for(let i=0;i<arrowN;i++){
    const L=R*(.8+.05*Math.sin(t*1.6+i*.9)+pulse*.14*Math.sin(i*2.4+t*9));
    const hd=R*.18,w=R*.08;
    const col='hsl('+((hue+i*9)%360)+',85%,'+(62+pulse*12)+'%)';
    cx.save();cx.rotate(i*Math.PI*2/arrowN);
    cx.strokeStyle=col;cx.fillStyle=col;cx.shadowColor=col;cx.shadowBlur=10+pulse*20+charge*14;
    cx.lineWidth=R*.032;cx.lineCap='round';
    cx.beginPath();cx.moveTo(R*.08,0);cx.lineTo(L-hd,0);cx.stroke();
    cx.beginPath();cx.moveTo(L,0);cx.lineTo(L-hd,-w);cx.lineTo(L-hd*.78,0);cx.lineTo(L-hd,w);cx.closePath();cx.fill();
    cx.restore();
  }
  cx.restore();

  cx.fillStyle='#ece3d0';cx.beginPath();cx.arc(c,c,R*.035+pulse*R*.03,0,6.2832);cx.fill();
}

function frame(ts){
  const dt=Math.min((ts-last)/1000||.016,.05);last=ts;
  vel+=(base-vel)*(1-Math.exp(-dt*.9));
  rot+=vel*dt;
  pulse*=Math.exp(-dt*2.2);
  charge*=Math.exp(-dt*.06);
  if(mood===null)hueT+=dt*drift;
  else{mt+=dt*(.25+drift*.01);hueT=mood+45*Math.sin(mt)}
  if(droneLp&&++dc%12===0)droneLp.frequency.setTargetAtTime(320+charge*600,ac.currentTime,.3);
  hue+=(hueT-hue)*(1-Math.exp(-dt*3));
  root.style.setProperty('--h',(hue%360).toFixed(1));
  if(cur&&++sf%3===0)drawSigil();
  draw(ts/1000);
  fireStep(dt,ts);
  if(secIdx===4)kdraw(dt,ts);
  requestAnimationFrame(frame);
}

function burst(){
  if(!reduce)vel+=(Math.random()<.5?-1:1)*(9+Math.random()*5);
  pulse=1;
  if(mood===null)hueT+=60+Math.random()*120;else mt+=1.5+Math.random()*2;
  charge=Math.min(1,charge+.22);
  root.style.setProperty('--h',Math.round(hueT%360));
  ripples.push(performance.now()/1000);sfx.tap();
  buzz(15);
}

let down=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  down={x:e.clientX,lx:e.clientX,moved:false};
});
cv.addEventListener('pointermove',e=>{
  if(!down)return;
  const dx=e.clientX-down.lx;down.lx=e.clientX;
  if(Math.abs(e.clientX-down.x)>8)down.moved=true;
  if(down.moved&&!reduce){rot+=dx/W*5;vel+=dx*.05;charge=Math.min(1,charge+Math.abs(dx)/W*.2)}
});
cv.addEventListener('pointerup',()=>{if(down&&!down.moved)burst();down=null});
cv.addEventListener('pointercancel',()=>{down=null});
cv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();burst()}});

/* ---------- Sigil ---------- */
const AB='ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ',VOW='AEIOUYÆØÅ';
const sg=$('#sigil'),sx=sg.getContext('2d');
let S=0,cur='';

function pt(ch){
  const a=-Math.PI/2+AB.indexOf(ch)/AB.length*Math.PI*2,r=S*.4;
  return [S/2+Math.cos(a)*r,S/2+Math.sin(a)*r];
}

function drawSigil(){
  sx.clearRect(0,0,S,S);
  sx.strokeStyle='rgba(169,155,184,.3)';sx.lineWidth=1;
  sx.beginPath();sx.arc(S/2,S/2,S*.4,0,6.2832);sx.stroke();
  sx.fillStyle='rgba(169,155,184,.45)';
  for(const ch of AB){const p=pt(ch);sx.beginPath();sx.arc(p[0],p[1],2,0,6.2832);sx.fill()}
  if(cur.length<2)return;
  const pts=[...cur].map(pt);
  const col='hsl('+(hue%360)+',80%,70%)';
  sx.strokeStyle=col;sx.shadowColor=col;sx.shadowBlur=8;
  sx.lineWidth=2.6;sx.lineJoin=sx.lineCap='round';
  sx.beginPath();pts.forEach((p,i)=>i?sx.lineTo(p[0],p[1]):sx.moveTo(p[0],p[1]));sx.stroke();
  sx.beginPath();sx.arc(pts[0][0],pts[0][1],8,0,6.2832);sx.stroke();
  const a=pts[pts.length-2],b=pts[pts.length-1];
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0])+Math.PI/2;
  sx.beginPath();
  sx.moveTo(b[0]-Math.cos(ang)*9,b[1]-Math.sin(ang)*9);
  sx.lineTo(b[0]+Math.cos(ang)*9,b[1]+Math.sin(ang)*9);sx.stroke();
  sx.shadowBlur=0;
}

$('#make').addEventListener('click',()=>{
  let seen='';
  for(const ch of $('#intent').value.toUpperCase()){
    if(AB.includes(ch)&&!VOW.includes(ch)&&!seen.includes(ch))seen+=ch;
  }
  cur=seen.length>=2?seen:'';
  if(cur)wish=cur;
  $('#letters').textContent=cur;
  if(!cur){const i=$('#intent');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake')}
  $('#save').disabled=$('#burn').disabled=!cur;
  sg.classList.remove('burn');
  drawSigil();
});
$('#intent').addEventListener('keydown',e=>{if(e.key==='Enter')$('#make').click()});

$('#save').addEventListener('click',()=>{
  const t=document.createElement('canvas');
  t.width=sg.width;t.height=sg.height;
  const tc=t.getContext('2d');
  tc.fillStyle='#160c20';tc.fillRect(0,0,t.width,t.height);
  tc.drawImage(sg,0,0);
  const a=document.createElement('a');
  a.download='sigil.png';a.href=t.toDataURL('image/png');a.click();
});

$('#burn').addEventListener('click',()=>{
  if(!cur)return;
  $('#burn').disabled=$('#save').disabled=true;
  sg.classList.add('burn');ignite();sfx.burn();buzz(burnPat());
  setTimeout(()=>{
    sg.classList.remove('burn');
    cur='';$('#intent').value='';
    $('#letters').textContent='';
    drawSigil();
  },reduce?50:2600);
});

/* ---------- Ild ---------- */
const fc=$('#fire'),fx=fc.getContext('2d');
let FW=0,FH=0,burnUntil=0,burnPts=[];const parts=[];
function fitFire(){const d=Math.min(devicePixelRatio||1,2);FW=fc.getBoundingClientRect().width;FH=FW*1.25;fc.width=Math.round(FW*d);fc.height=Math.round(FH*d);fx.setTransform(d,0,0,d,0,0)}
function ignite(){
  burnPts=[];const p=[...cur].map(pt);
  for(let i=1;i<p.length;i++)for(let k=0;k<8;k++){const u=k/8;burnPts.push([p[i-1][0]+(p[i][0]-p[i-1][0])*u,p[i-1][1]+(p[i][1]-p[i-1][1])*u])}
  burnUntil=performance.now()+2600;
}
function spawn(x,y,v,l,sz){parts.push({x:x,y:y,vx:(Math.random()-.5)*FW*.1,vy:-v*(.6+Math.random()*.8),t:0,max:l*(.6+Math.random()*.6),s:sz})}
function fireStep(dt,now){
  if(!FW)return;
  fx.globalCompositeOperation='source-over';fx.clearRect(0,0,FW,FH);
  const burning=now<burnUntil,n=reduce?2:(burning?10:3+Math.round(charge*8));
  for(let i=0;i<n;i++){
    if(burning&&burnPts.length&&Math.random()<.85){const b=burnPts[Math.random()*burnPts.length|0];spawn(b[0],b[1],FW*.25,.9,FW*.05)}
    else spawn(FW/2+(Math.random()-.5)*FW*(.16+charge*.12),FH*.97,FW*.28*(1+charge*.7),1.1+charge*.4,FW*.04*(1+charge*.8));
  }
  fx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.t+=dt;
    if(p.t>=p.max){parts.splice(i,1);continue}
    p.x+=p.vx*dt+Math.sin(p.t*9+p.y*.05)*FW*.1*dt;p.y+=p.vy*dt;
    const u=p.t/p.max,r=p.s*(1-u*.7);
    const g=fx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    g.addColorStop(0,'hsla('+(50+fireOff-u*45)+',100%,'+(65-u*25)+'%,'+(.55*(1-u))+')');
    g.addColorStop(1,'hsla('+(10+fireOff)+',100%,40%,0)');
    fx.fillStyle=g;fx.fillRect(p.x-r,p.y-r,r*2,r*2);
  }
}

/* ---------- Fuldskærm og sektioner ---------- */
addEventListener('click',()=>{
  if(document.fullscreenElement||document.webkitFullscreenElement)return;
  const f=root.requestFullscreen||root.webkitRequestFullscreen;
  if(f)try{const r=f.call(root,{navigationUI:'hide'});if(r&&r.catch)r.catch(()=>{})}catch(e){}
});
const secs=[...document.querySelectorAll('section')],dots=[...document.querySelectorAll('#dots button')];
dots.forEach((b,i)=>b.addEventListener('click',()=>secs[i].scrollIntoView({behavior:reduce?'auto':'smooth'})));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){dots.forEach((b,i)=>b.classList.toggle('on',secs[i]===e.target));secIdx=secs.indexOf(e.target)}}),{threshold:.6});
secs.forEach(x=>io.observe(x));

/* ---------- Tarot ---------- */
const SU=['Wands','Cups','Swords','Pentacles'],RK=['Ace','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Page','Knight','Queen','King'];
const MJ=['The Fool','The Magician','The High Priestess','The Empress','The Emperor','The Hierophant','The Lovers','The Chariot','Strength','The Hermit','Wheel of Fortune','Justice','The Hanged Man','Death','Temperance','The Devil','The Tower','The Star','The Moon','The Sun','Judgement','The World'];
const SYM=['M0-12V12M0-3L6-9M0 3L-6-3','M-8-8H8Q8 4 0 4Q-8 4-8-8ZM0 4V11M-5 11H5','M0-13V6M-6 6H6M0 6V12','M0-9L2.6-2.8L9-2.8L4 1.3L5.8 8L0 4.2L-5.8 8L-4 1.3L-9-2.8L-2.6-2.8Z'];
const roman=n=>{let r='';for(const v of [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']])while(n>=v[0]){r+=v[1];n-=v[0]}return r||'0'};
const rnd=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const sym=(s,x,y,k,c)=>'<g transform="translate('+x+' '+y+') scale('+k+')" fill="none" stroke="'+c+'" stroke-width="'+(1.6/k)+'" stroke-linecap="round" stroke-linejoin="round"><path d="'+SYM[s]+'"/>'+(s==3?'<circle r="11"/>':'')+'</g>';

function face(id){
  const mj=id<22,s=mj?0:(id-22)/14|0,r=mj?0:(id-22)%14;
  const c='hsl('+(mj?id*37%360:[25,200,265,140][s])+',72%,68%)';
  let g='',name,top='';
  if(mj){
    const R=rnd(id*977+5),n=3+(R()*6|0);
    for(let l=0;l<4;l++){
      const rad=18+l*17,st=1+(R()*(n-1)|0),o=R()*6.28;let d='';
      for(let i=0;i<n;i++){const a=o+i*st*6.2832/n;d+=(i?'L':'M')+(Math.cos(a)*rad).toFixed(1)+' '+(Math.sin(a)*rad).toFixed(1)}
      g+='<path d="'+d+'Z" opacity="'+(.95-l*.15)+'"/>'+(R()<.6?'<circle r="'+rad+'" opacity=".35"/>':'');
    }
    g='<g transform="translate(100 165)" fill="none" stroke="'+c+'" stroke-width="1.5" stroke-linejoin="round">'+g+'<circle r="3" fill="'+c+'"/></g>';
    name=MJ[id];top=roman(id);
  }else{
    name=RK[r]+' of '+SU[s];
    if(r<10){
      const n=r+1,cols=n==1?1:2,rows=Math.ceil(n/cols),k=n==1?5:n<5?2.8:2.2;
      for(let i=0;i<n;i++){
        const x=cols==1||(n%2&&i==n-1)?100:70+(i%2)*60,y=rows==1?165:80+(i/cols|0)*(170/(rows-1));
        g+=sym(s,x,y,k,c);
      }
    }else{
      const cnt=r-9;let d='';
      for(let i=0;i<cnt;i++)d+='M'+(100-cnt*10+i*20)+' 78l10-18 10 18';
      g=sym(s,100,170,5.5,c)+'<circle cx="100" cy="170" r="64" fill="none" stroke="'+c+'" stroke-dasharray="2 5" opacity=".6"/><path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linejoin="round"/>';
    }
  }
  const f='font-family="Palatino,Georgia,serif" text-anchor="middle"';
  return '<svg viewBox="0 0 200 340"><rect x="2" y="2" width="196" height="336" rx="10" fill="#1d0f2b" stroke="'+c+'"/><rect x="9" y="9" width="182" height="322" rx="6" fill="none" stroke="'+c+'" opacity=".4"/>'+g+'<text x="100" y="34" font-size="17" fill="'+c+'" '+f+'>'+top+'</text><text x="100" y="316" font-size="15" fill="#ece3d0" '+f+'>'+name+'</text></svg>';
}

function pick(d){
  const card=d.firstChild,fr=card.lastChild,flipped=card.classList.contains('flip');

  const id=deck.pop(),rev=Math.random()<.5,wait=flipped&&!reduce?450:0;

let ac,master,noiseB,muted=false;const drn=[];
function audio(){
  if(!ac){
    try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    master=ac.createGain();master.gain.value=muted?0:.6;master.connect(ac.destination);
    noiseB=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noiseB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;droneLp=lp;
    const g=ac.createGain();g.gain.value=.16;lp.connect(g);g.connect(master);
    [55,55.35,82.4].forEach(f=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f*pitchMul;o.connect(lp);o.start();drn.push([o,f])});
    const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=.06;lg.gain.value=120;l.connect(lg);lg.connect(lp.frequency);l.start();
  }
  if(ac.state==='suspended')ac.resume();
}
function tone(f,d,v,type,to,at){
  if(!ac||muted)return;const t=ac.currentTime+(at||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);
}
function puff(d,v,f,type,at){
  if(!ac||muted)return;const t=ac.currentTime+(at||0),src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  src.buffer=noiseB;fl.type=type||'bandpass';fl.frequency.value=f;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  src.connect(fl);fl.connect(g);g.connect(master);src.start(t,Math.random()*.5,d+.02);
}

const kc=$('#kompas'),kx=kc.getContext('2d');
let KW=0,ka=0,kw=0,kt=0,kk=30,kcc=4,kmode='still',kuntil=0,kj=0,ks=0;
const wr=d=>((d+Math.PI)%6.2832+6.2832)%6.2832-Math.PI;
function kpick(now){
  kmode=Math.random()<charge?pk(['jitter','spin','jump','seek']):['seek','seek','jitter','spin','still','still','jump','drift'][Math.random()*8|0];
  kuntil=now+(1500+Math.random()*3500)*(1-charge*.6);
  if(kmode==='seek'){kt=Math.random()*6.2832;kk=10+Math.random()*50;kcc=1.5+Math.random()*5}
  else if(kmode==='spin')kw=(Math.random()<.5?-1:1)*(8+Math.random()*12);
  else if(kmode==='jitter')kt=ka;
  else if(kmode==='still'){kw=0;ks=ka;kuntil=now+(5000+Math.random()*5000)*(1-charge*.5)}
  else if(kmode==='drift')kt=ka;
}
function kdraw(dt,now){
  if(!KW)return;
  if(now>kuntil)kpick(now);
  if(kmode==='seek')kw+=(kk*wr(kt-ka)-kcc*kw)*dt;
  else if(kmode==='jitter')kw+=((Math.random()-.5)*400*(1+charge*2)+30*wr(kt-ka)-5*kw)*dt;
  else if(kmode==='spin')kw*=Math.exp(-dt*.4);
  else if(kmode==='drift'){kt+=(Math.random()-.5)*dt*4;kw+=(3*wr(kt-ka)-3*kw)*dt}
  else if(kmode==='jump'){kw=0;if(now>kj){ka=Math.random()*6.2832;kj=now+180+Math.random()*500;sfx.tick();buzz(8)}}
  else{kw=0;ka=ks+(Math.random()-.5)*.06+Math.sin(now*.045)*.015}
  ka+=kw*dt;
  const c=KW/2,R=KW*.46,h=(hue%360).toFixed(0);
  kx.globalCompositeOperation='destination-out';kx.fillStyle='rgba(0,0,0,'+(reduce?1:.22)+')';kx.fillRect(0,0,KW,KW);
  kx.globalCompositeOperation='source-over';
  kx.save();kx.translate(c,c);
  kx.strokeStyle='hsla('+h+',70%,70%,.7)';kx.lineWidth=2;
  kx.beginPath();kx.arc(0,0,R,0,6.2832);kx.stroke();
  for(let i=0;i<72;i++){const a=i*Math.PI/36,l=i%9===0?.12:i%3===0?.06:.03;kx.beginPath();kx.moveTo(Math.sin(a)*R*(1-l),-Math.cos(a)*R*(1-l));kx.lineTo(Math.sin(a)*R,-Math.cos(a)*R);kx.stroke()}
  kx.rotate(ka);
  const w=R*.09,L=R*.8;
  kx.shadowColor='hsl('+h+',90%,60%)';kx.shadowBlur=14;
  kx.fillStyle='hsl('+h+',85%,62%)';kx.beginPath();kx.moveTo(0,-L);kx.lineTo(w,0);kx.lineTo(-w,0);kx.closePath();kx.fill();
  kx.fillStyle='rgba(236,227,208,.85)';kx.beginPath();kx.moveTo(0,L*.62);kx.lineTo(w,0);kx.lineTo(-w,0);kx.closePath();kx.fill();
  kx.shadowBlur=0;kx.fillStyle='#160c20';kx.beginPath();kx.arc(0,0,w*.45,0,6.2832);kx.fill();
  kx.restore();
}

const NOUNS=ALL.slice(0,iV),VERBS=ALL.slice(iV,iA),ADJ=ALL.slice(iA);
const pk=a=>a[Math.random()*a.length|0];
const fuge=a=>/[aeiouyæøå]$/.test(a)?'':pk(['','','s','e']);
const PRE=['u','mis','gen','for','ur','over','under','mod','sam','fra'];
const SO=['b','d','f','g','h','k','l','m','n','p','r','s','t','v','sk','st','tr','kl','fr','gl','sj','fl'];
const SV=['a','e','i','o','u','y','æ','ø','å','ej','au','a','e'];
const SC=['','','','n','r','l','m','s','k','nd','rt','ld','g','st'];
function inv(){let w='';const k=2+(Math.random()*2|0);for(let i=0;i<k;i++)w+=pk(SO)+pk(SV)+(i<k-1?pk(['','','n','r','l','s']):pk(SC));return w}
function gen1(){
  const r=Math.random();
  if(r<.18)return pk(ALL);
  if(r<.58){const a=pk(NOUNS);return a+fuge(a)+pk(NOUNS)}
  if(r<.66){const a=pk(NOUNS),b=pk(NOUNS);return a+fuge(a)+b+fuge(b)+pk(NOUNS)}
  if(r<.76)return pk(NOUNS)+pk(['løs','agtig','fuld','lig']);
  if(r<.82)return pk(ADJ)+'hed';
  if(r<.88)return pk(VERBS).replace(/e$/,'').replace(/(.)\1$/,'$1')+pk(['ing','else','ende']);
  if(r<.96)return pk(PRE)+pk(NOUNS.concat(ADJ));
  return inv();
}
function gen(){
  if(wish&&Math.random()<.6){
    let best='',bs=-1;
    for(let i=0;i<14;i++){
      const c=gen1();if(c.length>20)continue;
      const u=c.toUpperCase();let sc=0;
      for(const ch of wish)if(u.includes(ch))sc++;
      if(sc>bs){bs=sc;best=c}
    }
    if(best)return best;
  }
  let w;do w=gen1();while(w.length>20);
  return w;
}
const hd=$('#hand');let hbusy=false;
hd.innerHTML='<svg viewBox="-60 -60 120 120" width="112" height="112" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+arrows+'</svg>';
function nyHandling(){
  if(hbusy)return;hbusy=true;buzz(20);
  const fin=[gen(),gen(),gen()],shown=[],ticks=reduce?1:9+Math.round(charge*5);
  let n=0;
  const iv=setInterval(()=>{
    n++;
    for(let i=0;i<3;i++)shown[i]=n>=(reduce?1:ticks-4+i*2)?fin[i]:gen();
    hd.innerHTML=shown.map(w=>'<span>'+w+'</span>').join('');
    if(n>=ticks){clearInterval(iv);sfx.tap();buzz([30,40,60]);hbusy=false}else sfx.tick();
  },reduce?70:70-charge*35);
}
hd.addEventListener('click',nyHandling);
hd.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nyHandling()}});
/* ---------- Start ---------- */
function layout(){W=fit(cv,cx);S=fit(sg,sx);fitFire();KW=fit(kc,kx);drawSigil()}
addEventListener('resize',layout);
layout();
requestAnimationFrame(frame);
})();
