<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160c20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kaosalter</title>
<style>
/* Grundlag */
:root{--bg:#160c20;--ink:#ece3d0;--dim:#a99bb8;--wax:#b0342f;--h:285;--oct:hsl(var(--h),80%,66%);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg);scroll-snap-type:y mandatory}
body{margin:0;min-height:100vh;color:var(--ink);font:1.075rem/1.65 "Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;background:radial-gradient(120% 60% at 50% 18%,#2b1640 0%,var(--bg) 62%) no-repeat,var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
section{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1.25rem;scroll-snap-align:start;scroll-snap-stop:always}
canvas:focus-visible,button:focus-visible,input:focus-visible,.deck:focus-visible,#hand:focus-visible{outline:2px solid var(--oct);outline-offset:4px}

/* Knapper og felter */
button{display:inline-grid;place-items:center;min-width:48px;min-height:44px;padding:.55rem 1.1rem;font:inherit;color:var(--oct);background:transparent;border:1px solid var(--dim);border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.main{background:var(--wax);border-color:var(--wax);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button:not(:disabled):active{border-color:var(--oct)}
input{width:min(100%,24rem);margin:.4rem 0 1rem;padding:.6rem 0;font:inherit;color:var(--oct);caret-color:var(--oct);text-shadow:0 0 8px var(--oct);background:transparent;border:0;border-bottom:1px solid var(--oct);border-radius:0}
input.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;width:min(100%,24rem)}

/* Navigation og lyd */
#dots{position:fixed;right:.2rem;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;z-index:5}
#dots button{width:28px;height:28px;min-width:0;min-height:0;padding:0;border:0;background:radial-gradient(circle,var(--dim) 3px,transparent 4px)}
#dots button.on{background:radial-gradient(circle,var(--oct) 4px,transparent 5px)}
#mute{position:fixed;left:.2rem;top:calc(.2rem + env(safe-area-inset-top));z-index:5;border:0;background:none}

/* Kaossfære og kaoskompas */
#sphere,#kompas{display:block;width:min(100%,76dvh);aspect-ratio:1;margin:0 auto;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
#sphere{border-radius:50%}

/* Sigil og ild */
#wrap{position:relative;width:min(100%,22rem,calc((100dvh - 14rem)/1.25));aspect-ratio:1/1.25}
#sigil{display:block;position:absolute;left:0;top:0;width:100%;aspect-ratio:1}
#sigil.burn{transition:opacity 2.4s ease-in,filter 2.4s ease-in;opacity:0;filter:sepia(1) saturate(5) hue-rotate(-35deg) blur(3px) brightness(1.5)}
#fire{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Tarot */
#picker{display:flex;gap:.6rem;margin-bottom:1rem}
#picker button.on{border-color:var(--oct)}
#spread{--cw:min(62vw,15rem,calc(48dvh*.588));display:grid;gap:.5rem;justify-content:center;grid-auto-rows:calc(var(--cw)*1.7)}
#spread.s1{grid-template-columns:var(--cw)}
#spread.s3{--cw:min(calc((100vw - 3rem)/3.1),9rem,calc(40dvh*.588));grid-template-columns:repeat(3,var(--cw))}
#spread.s10{--cw:min(calc((100vw - 3rem)/4.6),6rem,calc((100dvh - 14rem)/7.2));grid-template-columns:repeat(4,var(--cw));gap:.35rem}
.deck{perspective:1200px;width:var(--cw);height:calc(var(--cw)*1.7);cursor:pointer;-webkit-tap-highlight-color:transparent}
.deck.x{transform:rotate(90deg);z-index:2}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{transform:rotateY(180deg)}
.face svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.face text{fill:var(--oct)}
#note{width:min(100%,22rem);min-height:6.5rem;margin-top:1.25rem;text-align:center;font-size:.95rem;line-height:1.5;color:var(--oct);text-shadow:0 0 8px var(--oct)}

/* Terninger */
.dice{display:flex;gap:1.5rem}
.die{width:min(34vw,9rem);aspect-ratio:1;min-height:0;padding:0;border:0;background:none}
.die svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 10px var(--oct))}
.die rect{fill:none;stroke:var(--oct);stroke-width:3}
.die circle{fill:var(--oct)}
.die.roll{animation:tumble .45s linear infinite}
.die.land svg{animation:land .8s ease-out}
@keyframes tumble{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.12)}100%{transform:rotate(360deg) scale(1)}}
@keyframes land{from{filter:drop-shadow(0 0 32px var(--oct)) brightness(2)}}

/* Tre ord */
#hand{width:min(100%,26rem);min-height:60dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;text-align:center;font-size:clamp(1.6rem,7.5vw,2.2rem);line-height:1.4;color:var(--oct);text-shadow:0 0 10px var(--oct);cursor:pointer;-webkit-tap-highlight-color:transparent}
#hand span{display:block;max-width:100%;overflow-wrap:anywhere}

/* Skifer */
#skifer{position:relative;padding:0;overflow:hidden;background:#000}
#slab{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
#dots,#mute,#mic{transition:opacity .4s}
body.slab #dots,body.slab #mute,body.slab #mic{opacity:0;pointer-events:none}
button.cold:not(:disabled){opacity:.55}
#burn:not(.cold):not(:disabled){border-color:var(--oct);box-shadow:0 0 14px var(--oct)}

@media (prefers-reduced-motion:reduce){
  input.shake,.die.roll,.die.land svg{animation:none}
  #sigil.burn{transition-duration:.01s}
  .card{transition:none}
}
/* Tarot: swipe til højre viser pladsernes betydning */
#tarot{position:relative;overflow:hidden;touch-action:pan-y}
#tarot::before{content:"";position:absolute;left:0;top:50%;width:3px;height:2.5rem;transform:translateY(-50%);border-radius:0 3px 3px 0;background:var(--oct);opacity:.5;box-shadow:0 0 8px var(--oct);pointer-events:none}
#posinfo{position:absolute;inset:0;z-index:3;overflow-y:auto;touch-action:pan-y;padding:1.5rem 1.25rem 2rem;background:#160c20;color:var(--oct);transform:translateX(-102%);transition:transform .45s cubic-bezier(.3,.7,.2,1);visibility:hidden}
#posinfo.open{transform:none;visibility:visible}
#posinfo svg.dia{display:block;width:min(46%,8rem);margin:0 auto 1.25rem;overflow:visible;filter:drop-shadow(0 0 8px var(--oct))}
#posinfo svg.dia rect{fill:none;stroke:var(--oct);stroke-width:1.2}
#posinfo svg.dia text{fill:var(--oct);font:7px "Palatino Linotype",Palatino,Georgia,serif;text-anchor:middle}
#posinfo ol{list-style:none;margin:0 auto;padding:0;max-width:26rem}
#posinfo li{display:grid;grid-template-columns:1.6rem 1fr;gap:.6rem;margin:0 0 .85rem;font-size:.95rem;line-height:1.4;text-shadow:0 0 8px var(--oct)}
#posinfo li b{font-weight:400;border:1px solid var(--oct);border-radius:50%;width:1.5rem;height:1.5rem;display:grid;place-items:center;font-size:.8rem}
#posinfo li span strong{font-weight:400;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;display:block}
.pos{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-style:normal;font-size:clamp(.7rem,2.6vw,.95rem);color:var(--oct);opacity:.8;text-shadow:0 0 6px var(--oct)}
@media (prefers-reduced-motion:reduce){#posinfo{transition:none}}
#mic{position:fixed;left:4.2rem;top:calc(.2rem + env(safe-area-inset-top));z-index:5;border:0;background:none;color:var(--dim)}
#mic.live{color:var(--oct);filter:drop-shadow(0 0 8px var(--oct))}
#mic.shake{animation:shake .35s}
</style>
</head>
<body>
<button id="mute" aria-label="Lyd"></button>
<button id="mic" aria-label="Mikrofon"></button>
<nav id="dots"><button aria-label="Kaossfære"></button><button aria-label="Sigil"></button><button aria-label="Tarot"></button><button aria-label="Terninger"></button><button aria-label="Kaoskompas"></button><button aria-label="Ord"></button><button aria-label="Skifer"></button></nav>
<section>
  <canvas id="sphere" tabindex="0" role="button" aria-label="Kaossfære"></canvas>
</section>
<section>
  <input id="intent" type="text" maxlength="120" autocomplete="off" aria-label="Dit ønske">
  <div class="row">
    <button id="make" class="main" aria-label="Lav sigil" title="Lav sigil"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></svg></button>
    <button id="save" disabled aria-label="Gem billede" title="Gem billede"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button>
    <button id="burn" disabled aria-label="Brænd" title="Brænd"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg></button>
  </div>
    <div id="wrap"><canvas id="sigil" aria-label="Din sigil"></canvas><canvas id="fire"></canvas></div>
</section>
<section id="tarot">
  <div id="picker">
    <button data-n="1" class="on" aria-label="Ét kort"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="1.5"/></svg></button>
    <button data-n="3" aria-label="Tre kort"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="6" width="6" height="12" rx="1"/><rect x="9" y="6" width="6" height="12" rx="1"/><rect x="16" y="6" width="6" height="12" rx="1"/></svg></button>
    <button data-n="10" aria-label="Keltisk kors"><svg viewBox="0 0 28 24" width="28" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="9" width="5" height="6"/><rect x="8" y="2" width="5" height="5"/><rect x="8" y="17" width="5" height="5"/><rect x="1" y="9" width="5" height="6"/><rect x="15" y="9" width="5" height="6"/><rect x="23" y="2" width="4" height="4"/><rect x="23" y="7" width="4" height="4"/><rect x="23" y="12" width="4" height="4"/><rect x="23" y="17" width="4" height="4"/></svg></button>
  </div>
  <div id="spread"></div>
  <div id="note" aria-live="polite"></div>
  <div id="posinfo" aria-hidden="true"></div>
</section>
<section>
  <div class="dice"><button class="die" aria-label="Terning"></button><button class="die" aria-label="Terning"></button></div>
</section>
<section>
  <canvas id="kompas" role="button" aria-label="Kaoskompas"></canvas>
</section>
<section>
  <div id="hand" tabindex="0" role="button" aria-label="Tre ord"></div>
</section>
<section id="skifer"><canvas id="slab" aria-label="Skifer"></canvas></section>

<script>
/* Kaosalter. Sider: kaossfære, sigil, tarot, terninger, kaoskompas, tre ord.
   Rækkefølge i filen: tilstand, kaossfære, sigil, ild, fuldskærm og sider, tarot,
   haptik, lyd, terninger (med gemt tilstand), kaoskompas, tre ord, start. */
(()=>{
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement;

/* ---------- Kaossfære ---------- */
const cv=$('#sphere'),cx=cv.getContext('2d');
let W=0,last=0,secIdx=0,sf=0,dc=0;
let charge=0,mood=null,mt=0,droneLp=null,wish='';   /* ladning, stemning fra kort, sidste sigils bogstaver */
let rot=0,base=reduce?0:.25,vel=base,pulse=0,hue=285,hueT=285;
const ripples=[];
let arrowN=8,trailA=.24,drift=10,fireOff=0,pitchMul=1;

function fit(canvas,ctx){
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=canvas.getBoundingClientRect().width;
  canvas.width=canvas.height=Math.round(w*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return w;
}

function draw(t){
  const c=W/2,R=W*.46;
  cx.globalCompositeOperation='destination-out';
  cx.fillStyle='rgba(0,0,0,'+(reduce?1:trailA)+')';
  cx.fillRect(0,0,W,W);
  cx.globalCompositeOperation='source-over';

  for(let i=ripples.length-1;i>=0;i--){
    const age=t-ripples[i];
    if(age>1.3){ripples.splice(i,1);continue}
    cx.strokeStyle='hsla('+(hue%360)+',85%,70%,'+(.55*(1-age/1.3))+')';
    cx.lineWidth=2;
    cx.beginPath();cx.arc(c,c,R*(.1+age*.75),0,6.2832);cx.stroke();
  }

  cx.save();cx.translate(c,c);cx.rotate(rot);
  for(let i=0;i<arrowN;i++){
    const L=R*(.8+.05*Math.sin(t*1.6+i*.9)+pulse*.14*Math.sin(i*2.4+t*9));
    const hd=R*.18,w=R*.08;
    const col='hsl('+((hue+i*9)%360)+',85%,'+(62+pulse*12)+'%)';
    cx.save();cx.rotate(i*Math.PI*2/arrowN);
    cx.strokeStyle=col;cx.fillStyle=col;cx.shadowColor=col;cx.shadowBlur=10+pulse*20+charge*14;
    cx.lineWidth=R*.032;cx.lineCap='round';
    cx.beginPath();cx.moveTo(R*.08,0);cx.lineTo(L-hd,0);cx.stroke();
    cx.beginPath();cx.moveTo(L,0);cx.lineTo(L-hd,-w);cx.lineTo(L-hd*.78,0);cx.lineTo(L-hd,w);cx.closePath();cx.fill();
    cx.restore();
  }
  cx.restore();

  cx.fillStyle='#ece3d0';cx.beginPath();cx.arc(c,c,R*.035+pulse*R*.03,0,6.2832);cx.fill();
}

function frame(ts){
  const dt=Math.min((ts-last)/1000||.016,.05);last=ts;
  vel+=(base-vel)*(1-Math.exp(-dt*.9));
  rot+=vel*dt;
  pulse*=Math.exp(-dt*2.2);
  charge*=Math.exp(-dt*.06);
  micStep(dt,ts);
  if(mood===null)hueT+=dt*drift;
  else{mt+=dt*(.25+drift*.01);hueT=mood+45*Math.sin(mt)}
  if(droneLp&&++dc%12===0)droneLp.frequency.setTargetAtTime(320+charge*600,ac.currentTime,.3);
  hue+=(hueT-hue)*(1-Math.exp(-dt*3));
  root.style.setProperty('--h',(hue%360).toFixed(1));
  if(cur&&++sf%3===0)drawSigil();
  draw(ts/1000);
  fireStep(dt,ts);
  updateBurn();
  if(secIdx===4)kdraw(dt,ts);
  if(secIdx===6)slabDraw();
  requestAnimationFrame(frame);
}

function burst(){
  if(!reduce)vel+=(Math.random()<.5?-1:1)*(9+Math.random()*5);
  pulse=1;
  if(mood===null)hueT+=60+Math.random()*120;else mt+=1.5+Math.random()*2;
  charge=Math.min(1,charge+.22);
  root.style.setProperty('--h',Math.round(hueT%360));
  ripples.push(performance.now()/1000);sfx.tap();
  buzz(15);
}

let down=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  down={x:e.clientX,lx:e.clientX,moved:false};
});
cv.addEventListener('pointermove',e=>{
  if(!down)return;
  const dx=e.clientX-down.lx;down.lx=e.clientX;
  if(Math.abs(e.clientX-down.x)>8)down.moved=true;
  if(down.moved&&!reduce){rot+=dx/W*5;vel+=dx*.05;charge=Math.min(1,charge+Math.abs(dx)/W*.2)}
});
cv.addEventListener('pointerup',()=>{if(down&&!down.moved)burst();down=null});
cv.addEventListener('pointercancel',()=>{down=null});
cv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();burst()}});

/* ---------- Sigil ---------- */
const AB='ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ',VOW='AEIOUYÆØÅ';
const sg=$('#sigil'),sx=sg.getContext('2d');
let S=0,cur='';

function pt(ch){
  const a=-Math.PI/2+AB.indexOf(ch)/AB.length*Math.PI*2,r=S*.4;
  return [S/2+Math.cos(a)*r,S/2+Math.sin(a)*r];
}

function drawSigil(){
  sx.clearRect(0,0,S,S);
  sx.strokeStyle='rgba(169,155,184,.3)';sx.lineWidth=1;
  sx.beginPath();sx.arc(S/2,S/2,S*.4,0,6.2832);sx.stroke();
  sx.fillStyle='rgba(169,155,184,.45)';
  for(const ch of AB){const p=pt(ch);sx.beginPath();sx.arc(p[0],p[1],2,0,6.2832);sx.fill()}
  if(cur.length<2)return;
  const pts=[...cur].map(pt);
  const col='hsl('+(hue%360)+',80%,70%)';
  sx.strokeStyle=col;sx.shadowColor=col;sx.shadowBlur=8;
  sx.lineWidth=2.6;sx.lineJoin=sx.lineCap='round';
  sx.beginPath();pts.forEach((p,i)=>i?sx.lineTo(p[0],p[1]):sx.moveTo(p[0],p[1]));sx.stroke();
  sx.beginPath();sx.arc(pts[0][0],pts[0][1],8,0,6.2832);sx.stroke();
  const a=pts[pts.length-2],b=pts[pts.length-1];
  const ang=Math.atan2(b[1]-a[1],b[0]-a[0])+Math.PI/2;
  sx.beginPath();
  sx.moveTo(b[0]-Math.cos(ang)*9,b[1]-Math.sin(ang)*9);
  sx.lineTo(b[0]+Math.cos(ang)*9,b[1]+Math.sin(ang)*9);sx.stroke();
  sx.shadowBlur=0;
}

$('#make').addEventListener('click',()=>{
  let seen='';
  for(const ch of $('#intent').value.toUpperCase()){
    if(AB.includes(ch)&&!VOW.includes(ch)&&!seen.includes(ch))seen+=ch;
  }
  const inp=$('#intent');
  if(seen.length<2){inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');return}
  cur=wish=seen;
  inp.value='';
  $('#save').disabled=false;
  sg.classList.remove('burn');
  drawSigil();
});
$('#intent').addEventListener('keydown',e=>{if(e.key==='Enter')$('#make').click()});

$('#save').addEventListener('click',()=>{
  const t=document.createElement('canvas');
  t.width=sg.width;t.height=sg.height;
  const tc=t.getContext('2d');
  tc.fillStyle='#160c20';tc.fillRect(0,0,t.width,t.height);
  tc.drawImage(sg,0,0);
  const a=document.createElement('a');
  a.download='sigil.png';a.href=t.toDataURL('image/png');a.click();
});

const BURN_AT=.55,bb=$('#burn');
let burnReady=false;
function updateBurn(){
  const has=!!cur&&performance.now()>burnUntil;
  const r=has&&(burnReady?charge>=BURN_AT*.45:charge>=BURN_AT);
  bb.disabled=!has;bb.classList.toggle('cold',!r);burnReady=r;
}
function fizzle(){
  for(let i=0;i<10;i++)spawn(FW/2+(Math.random()-.5)*FW*.3,FH*.9,FW*.2,.5,FW*.03);
  sfx.pop(.2);buzz(6);
}
bb.addEventListener('click',()=>{
  if(!cur)return;
  if(!burnReady){fizzle();return}
  $('#save').disabled=true;
  sg.classList.add('burn');ignite();sfx.burn();buzz(burnPat());
  setTimeout(()=>{sg.classList.remove('burn');cur='';drawSigil()},reduce?50:2600);
});

/* ---------- Ild ---------- */
const fc=$('#fire'),fx=fc.getContext('2d');
let FW=0,FH=0,burnUntil=0,burnPts=[];const parts=[];
function fitFire(){const d=Math.min(devicePixelRatio||1,2);FW=fc.getBoundingClientRect().width;FH=FW*1.25;fc.width=Math.round(FW*d);fc.height=Math.round(FH*d);fx.setTransform(d,0,0,d,0,0)}
function ignite(){
  burnPts=[];const p=[...cur].map(pt);
  for(let i=1;i<p.length;i++)for(let k=0;k<8;k++){const u=k/8;burnPts.push([p[i-1][0]+(p[i][0]-p[i-1][0])*u,p[i-1][1]+(p[i][1]-p[i-1][1])*u])}
  burnUntil=performance.now()+2600;
  charge*=.35;
}
function spawn(x,y,v,l,sz){parts.push({x:x,y:y,vx:(Math.random()-.5)*FW*.1,vy:-v*(.6+Math.random()*.8),t:0,max:l*(.6+Math.random()*.6),s:sz})}
function fireStep(dt,now){
  if(!FW)return;
  fx.globalCompositeOperation='source-over';fx.clearRect(0,0,FW,FH);
  const burning=now<burnUntil,n=reduce?2:(burning?10:3+Math.round(charge*8));
  for(let i=0;i<n;i++){
    if(burning&&burnPts.length&&Math.random()<.85){const b=burnPts[Math.random()*burnPts.length|0];spawn(b[0],b[1],FW*.25,.9,FW*.05)}
    else spawn(FW/2+(Math.random()-.5)*FW*(.16+charge*.12),FH*.97,FW*.28*(1+charge*.7),1.1+charge*.4,FW*.04*(1+charge*.8));
  }
  fx.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.t+=dt;
    if(p.t>=p.max){parts.splice(i,1);continue}

    g.addColorStop(0,'hsla('+(50+fireOff-u*45)+',100%,'+(65-u*25)+'%,'+(.55*(1-u))+')');

let micAn=null,micBuf=null,micStream=null,micSrc=null,voice=0,vFloor=.004,vPrev=0,vLast=0;
const mic=$('#mic');
const MICSVG='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>';
function micIcon(){mic.innerHTML=MICSVG+(micAn?'':'<path d="M4 4l16 16"/>')+'</svg>';mic.classList.toggle('live',!!micAn)}
async function micStart(){
  audio();
  if(!ac||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('ingen mikrofon');
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
  if(ac.state==='suspended')await ac.resume();
  micSrc=ac.createMediaStreamSource(micStream);
  const an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=0;
  micSrc.connect(an);micBuf=new Float32Array(an.fftSize);vFloor=.004;vPrev=0;micAn=an;
}
function micStop(){
  if(micStream)micStream.getTracks().forEach(t=>t.stop());
  try{if(micSrc)micSrc.disconnect()}catch(e){}
  micAn=micSrc=micStream=null;voice=0;
}
mic.addEventListener('click',async()=>{
  if(micAn){micStop()}
  else{
    try{await micStart()}
    catch(e){micStop();mic.classList.remove('shake');void mic.offsetWidth;mic.classList.add('shake')}
  }
  micIcon();applyGain();
});
micIcon();

/* En lyd tæller som et tryk på kaossfæren; vedvarende lyd lader ilden op. */
function voiceBurst(){
  if(!reduce)vel+=(Math.random()<.5?-1:1)*(6+Math.random()*5);
  pulse=1;charge=Math.min(1,charge+.18);
  if(secIdx===0){
    if(mood===null)hueT+=30+Math.random()*60;else mt+=.8+Math.random()*1.2;
    ripples.push(performance.now()/1000);
  }
}
function micStep(dt,now){
  if(!micAn){voice*=Math.exp(-dt*6);return}
  micAn.getFloatTimeDomainData(micBuf);
  let sum=0;for(let i=0;i<micBuf.length;i++)sum+=micBuf[i]*micBuf[i];
  const rms=Math.sqrt(sum/micBuf.length);
  vFloor+=(rms-vFloor)*(rms<vFloor?.3:.0015);            /* følger baggrundsstøjen, så den ikke tæller med */
  const v=Math.min(1,Math.max(0,(rms-vFloor*1.25-.0015)*45));   /* følsomhed: hvisken er nok */
  voice+=(v-voice)*(1-Math.exp(-dt*(v>voice?40:6)));
  if(voice>.28&&vPrev<=.28&&now-vLast>180){vLast=now;voiceBurst()}
  vPrev=voice;
  charge=Math.min(1,charge+voice*dt*.5);
  pulse=Math.max(pulse,voice*.8);
}

/* ---------- Terninger ---------- */
const PIP={1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,24],[72,24],[28,50],[72,50],[28,76],[72,76]]};
const dieSvg=n=>'<svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="16"/>'+PIP[n].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7.5"/>').join('')+'</svg>';
const dies=[...document.querySelectorAll('.die')];
let rolling=false;
const KEY='kaosalter.v1';
const clampN=(v,lo,hi,d)=>typeof v==='number'&&v>=lo&&v<=hi?v:d;
function saveState(){
  try{localStorage.setItem(KEY,JSON.stringify({arrowN:arrowN,trailA:trailA,drift:drift,fireOff:fireOff,pitchMul:pitchMul,base:reduce?undefined:base,mood:mood===null?undefined:((mood%360)+360)%360}))}catch(e){}
}
function loadState(){
  try{
    const o=JSON.parse(localStorage.getItem(KEY)||'{}');
    arrowN=clampN(o.arrowN,3,12,arrowN);trailA=clampN(o.trailA,.02,1,trailA);drift=clampN(o.drift,0,200,drift);
    fireOff=clampN(o.fireOff,-60,360,fireOff);pitchMul=clampN(o.pitchMul,.4,2.5,pitchMul);
    if(!reduce){base=clampN(o.base,-2,2,base);vel=base}
    mood=clampN(o.mood,0,360,null);if(mood!==null)hue=hueT=mood;
  }catch(e){}
}
loadState();

function resetDice(){
  arrowN=8;trailA=.24;drift=10;fireOff=0;pitchMul=1;
  if(!reduce){base=.25;vel+=3}
  if(ac)drn.forEach(d=>d[0].frequency.setTargetAtTime(d[1],ac.currentTime,.6));
  pulse=1;ripples.push(performance.now()/1000);
  sfx.reset();buzz([70,50,70,50,220]);
  saveState();
}
function effect(a,b){
  if((a===1&&b===1)||(a===6&&b===6)){resetDice();return}
  const i=b-1;
  if(a===1){if(!reduce){base=[-1.6,-.6,-.1,.1,.6,1.6][i];vel+=base*3}}
  else if(a===2)arrowN=[3,4,5,6,8,12][i];
  else if(a===3)drift=[0,3,10,25,60,140][i];
  else if(a===4)trailA=[.9,.5,.24,.12,.06,.03][i];
  else if(a===5)fireOff=[0,170,100,230,290,-40][i];
  else{pitchMul=[.5,.75,1,1.25,1.5,2][i];if(ac)drn.forEach(d=>d[0].frequency.setTargetAtTime(d[1]*pitchMul,ac.currentTime,.6))}
  pulse=1;ripples.push(performance.now()/1000);
  saveState();
}
function roll(){
  if(rolling)return;rolling=true;sfx.dice();buzz(DICEPAT);
  dies.forEach(e=>e.classList.add('roll'));
  let n=0;
  const iv=setInterval(()=>{
    dies.forEach(e=>{e.innerHTML=dieSvg(1+Math.random()*6|0)});
    if(++n>=8){
      clearInterval(iv);
      const a=1+Math.random()*6|0,b=1+Math.random()*6|0;
      dies[0].innerHTML=dieSvg(a);dies[1].innerHTML=dieSvg(b);
      dies.forEach(e=>e.classList.remove('roll'));
      effect(a,b);
      dies.forEach(e=>{e.classList.remove('land');void e.offsetWidth;e.classList.add('land')});
      rolling=false;
    }
  },90);
}
dies.forEach(e=>{e.innerHTML=dieSvg(1+Math.random()*6|0);e.addEventListener('click',roll)});
/* ---------- Kaoskompas ---------- */
const kc=$('#kompas'),kx=kc.getContext('2d');
let KW=0,ka=0,kw=0,kt=0,kk=30,kcc=4,kmode='still',kuntil=0,kj=0,ks=0;
const wr=d=>((d+Math.PI)%6.2832+6.2832)%6.2832-Math.PI;
function kpick(now){
  kmode=Math.random()<charge?pk(['jitter','spin','jump','seek']):['seek','seek','jitter','spin','still','still','jump','drift'][Math.random()*8|0];
  kuntil=now+(1500+Math.random()*3500)*(1-charge*.6);
  if(kmode==='seek'){kt=Math.random()*6.2832;kk=10+Math.random()*50;kcc=1.5+Math.random()*5}
  else if(kmode==='spin')kw=(Math.random()<.5?-1:1)*(8+Math.random()*12);
  else if(kmode==='jitter')kt=ka;
  else if(kmode==='still'){kw=0;ks=ka;kuntil=now+(5000+Math.random()*5000)*(1-charge*.5)}
  else if(kmode==='drift')kt=ka;
}
function kdraw(dt,now){
  if(!KW)return;
  if(now>kuntil)kpick(now);
  if(kmode==='seek')kw+=(kk*wr(kt-ka)-kcc*kw)*dt;
  else if(kmode==='jitter')kw+=((Math.random()-.5)*400*(1+charge*2)+30*wr(kt-ka)-5*kw)*dt;
  else if(kmode==='spin')kw*=Math.exp(-dt*.4);
  else if(kmode==='drift'){kt+=(Math.random()-.5)*dt*4;kw+=(3*wr(kt-ka)-3*kw)*dt}
  else if(kmode==='jump'){kw=0;if(now>kj){ka=Math.random()*6.2832;kj=now+180+Math.random()*500;sfx.tick();buzz(8)}}
  else{kw=0;ka=ks+(Math.random()-.5)*.06+Math.sin(now*.045)*.015}
  ka+=kw*dt;
  const c=KW/2,R=KW*.46,h=(hue%360).toFixed(0);
  kx.globalCompositeOperation='destination-out';kx.fillStyle='rgba(0,0,0,'+(reduce?1:.22)+')';kx.fillRect(0,0,KW,KW);
  kx.globalCompositeOperation='source-over';
  kx.save();kx.translate(c,c);
  kx.strokeStyle='hsla('+h+',70%,70%,.7)';kx.lineWidth=2;
  kx.beginPath();kx.arc(0,0,R,0,6.2832);kx.stroke();
  for(let i=0;i<72;i++){const a=i*Math.PI/36,l=i%9===0?.12:i%3===0?.06:.03;kx.beginPath();kx.moveTo(Math.sin(a)*R*(1-l),-Math.cos(a)*R*(1-l));kx.lineTo(Math.sin(a)*R,-Math.cos(a)*R);kx.stroke()}
  kx.rotate(ka);
  const w=R*.09,L=R*.8;
  kx.shadowColor='hsl('+h+',90%,60%)';kx.shadowBlur=14;
  kx.fillStyle='hsl('+h+',85%,62%)';kx.beginPath();kx.moveTo(0,-L);kx.lineTo(w,0);kx.lineTo(-w,0);kx.closePath();kx.fill();
  kx.fillStyle='rgba(236,227,208,.85)';kx.beginPath();kx.moveTo(0,L*.62);kx.lineTo(w,0);kx.lineTo(-w,0);kx.closePath();kx.fill();
  kx.shadowBlur=0;kx.fillStyle='#160c20';kx.beginPath();kx.arc(0,0,w*.45,0,6.2832);kx.fill();
  kx.restore();
}
kc.addEventListener('click',()=>{kuntil=0;kw+=(Math.random()-.5)*10;sfx.tick();buzz(12)});

/* ---------- Tre ord ---------- */
const ALL='tærskel spejl aske bro støj nøgle ekko tåge tråd sprække lys sne ild ur dør skygge glimt sand vand sten kompas rod frø hul væg tag stige snor knude klokke nål fjer knogle mælk salt honning jern kobber glas lampe kort bog brev stemme hvisken skrig stilhed drøm hukommelse navn ansigt hånd øje hjerte åndedræt puls rytme dans sang bølge storm regn frost mørke solopgang måne stjerne kilde skov mark vej kryds omvej labyrint port have tårn kælder loft rum hjørne grænse hjul kugle terning mønt maske kappe krone ring spiral cirkel kvadrat linje prik vind rejse gave offer løgn hemmelighed gæld løfte tvivl tro tilfældighed skæbne vane bryde bøje falde flyve gemme grave huske glemme hviske lede låse mærke nynne omfavne opløse pege rense risikere samle skjule skifte slippe smelte spørge svæve synke tænde tømme vække vende våge åbne lukke ånde danse dryppe fryse bevæge tom fuld blød hård skarp stille høj sprød vild fremmed gammel ny skjult fælles forkert mørk langsom hurtig tung let skør blind døv bar hel brudt tavs varm kold sulten tørstig søvnig vågen skæv rund'.split(' ');
const iV=ALL.indexOf('bryde'),iA=ALL.indexOf('tom');
const NOUNS=ALL.slice(0,iV),VERBS=ALL.slice(iV,iA),ADJ=ALL.slice(iA);
const pk=a=>a[Math.random()*a.length|0];
const fuge=a=>/[aeiouyæøå]$/.test(a)?'':pk(['','','s','e']);
const PRE=['u','mis','gen','for','ur','over','under','mod','sam','fra'];
const SO=['b','d','f','g','h','k','l','m','n','p','r','s','t','v','sk','st','tr','kl','fr','gl','sj','fl'];
const SV=['a','e','i','o','u','y','æ','ø','å','ej','au','a','e'];
const SC=['','','','n','r','l','m','s','k','nd','rt','ld','g','st'];
function inv(){let w='';const k=2+(Math.random()*2|0);for(let i=0;i<k;i++)w+=pk(SO)+pk(SV)+(i<k-1?pk(['','','n','r','l','s']):pk(SC));return w}
function gen1(){
  const r=Math.random();
  if(r<.18)return pk(ALL);
  if(r<.58){const a=pk(NOUNS);return a+fuge(a)+pk(NOUNS)}
  if(r<.66){const a=pk(NOUNS),b=pk(NOUNS);return a+fuge(a)+b+fuge(b)+pk(NOUNS)}
  if(r<.76)return pk(NOUNS)+pk(['løs','agtig','fuld','lig']);
  if(r<.82)return pk(ADJ)+'hed';
  if(r<.88)return pk(VERBS).replace(/e$/,'').replace(/(.)\1$/,'$1')+pk(['ing','else','ende']);
  if(r<.96)return pk(PRE)+pk(NOUNS.concat(ADJ));
  return inv();
}
function gen(){
  if(wish&&Math.random()<.6){
    let best='',bs=-1;
    for(let i=0;i<14;i++){
      const c=gen1();if(c.length>20)continue;
      const u=c.toUpperCase();let sc=0;
      for(const ch of wish)if(u.includes(ch))sc++;
      if(sc>bs){bs=sc;best=c}
    }
    if(best)return best;
  }
  let w;do w=gen1();while(w.length>20);
  return w;
}
const hd=$('#hand');let hbusy=false;
hd.innerHTML='<svg viewBox="-60 -60 120 120" width="112" height="112" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+arrows+'</svg>';
function nyHandling(){
  if(hbusy)return;hbusy=true;buzz(20);
  const fin=[gen(),gen(),gen()],shown=[],ticks=reduce?1:9+Math.round(charge*5);
  let n=0;
  const iv=setInterval(()=>{
    n++;
    for(let i=0;i<3;i++)shown[i]=n>=(reduce?1:ticks-4+i*2)?fin[i]:gen();
    hd.innerHTML=shown.map(w=>'<span>'+w+'</span>').join('');
    if(n>=ticks){clearInterval(iv);sfx.tap();buzz([30,40,60]);hbusy=false}else sfx.tick();
  },reduce?70:70-charge*35);
}
hd.addEventListener('click',nyHandling);
hd.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nyHandling()}});
/* ---------- Skifer (WebGL) ---------- */
const BREATH=10;   /* sekunder pr. åndedrag */
const SLAB={sideCm:1.2,vertCm:2};   /* ildbåndets bredde i cm: siderne og foroven/forneden; skiferen fylder resten */
const PX_PER_CM=60;   /* ca. CSS-pixel pr. cm på en telefon */
function slabRect(){const mx=SLAB.sideCm*PX_PER_CM*SQ,my=SLAB.vertCm*PX_PER_CM*SQ;return[mx,my,SW-mx,SH-my]}
const breath=()=>.5+.5*Math.sin(performance.now()/1000*6.28318/BREATH-1.5708);
const slabTime=()=>(performance.now()/1000*(reduce?.3:1))%3600;
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 u_res;uniform float u_t;uniform vec4 u_slab;uniform vec4 u_rip[6];
uniform float u_hue;uniform float u_charge;uniform float u_breath;uniform float u_calm;uniform float u_s;uniform float u_voice;
float h11(float n){n=fract(n*.1031);n*=n+33.33;n*=n+n;return fract(n);}
float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec2(11.3,7.1);a*=.5;}return s;}
vec3 pal(float t,float h){return .5+.5*cos(6.28318*(vec3(t)+vec3(0.,.33,.67)+h));}
/* flammefelt: u = langs kanten, v = udad fra kanten */
float field(float u,float v,float t,float w){
  float ww=sin(u*.11-t*7.)+.6*sin(u*.27+t*11.);   /* bølger, der løber langs kanten */
  u+=ww*w*5.;
  v-=w*(8.+6.*ww);
  return fbm(vec2(u*.075,v*.03-t*1.5))+.4*fbm(vec2(u*.17,v*.07-t*3.4))+ww*w*.16;
}
void main(){
  vec2 px=vec2(gl_FragCoord.x,u_res.y-gl_FragCoord.y);
  vec2 ctr=(u_slab.xy+u_slab.zw)*.5,hb=(u_slab.zw-u_slab.xy)*.5;
  vec2 pc=px-ctr;
  vec2 dv=pc-clamp(pc,-hb,hb);
  float dl=length(dv);
  vec3 slab=vec3(.014,.014,.022);
  if(dl<.001){gl_FragColor=vec4(slab,1.);return;}
  float t=u_t;
  float z=.6/u_s;
  float front=0.;
  for(int i=0;i<6;i++){
    vec4 r=u_rip[i];float age=u_t-r.z;
    if(r.w>0.&&age>0.&&age<3.){
      float dd=length(px-r.xy),rad=age*u_res.y*.45,w=u_res.y*.06,k=(dd-rad)/w;
      front+=exp(-k*k)*(1.-age/3.);
    }
  }
  float hn=u_hue/360.;
  float hs=hn+.12*sin(atan(pc.y,pc.x)*2.+t*.6);
  /* to støjfelter (top/bund og sider) blandes blødt, så hjørnerne bliver glatte */
  float ax=abs(dv.x),ay=abs(dv.y);
  float wA=ay/(ax+ay);
  float fn=0.;
  float vw=u_voice*(1.-.6*u_calm);
  if(wA>.002)fn+=wA*field((pc.x+(dv.y>0.?190.:0.))*z,ay*z,t,vw);
  if(wA<.998)fn+=(1.-wA)*field((pc.y+(dv.x>0.?310.:70.))*z+500.,ax*z,t,vw);
  float mx=u_res.x*.5-hb.x,my=u_res.y*.5-hb.y;
  float nx=dv.x/dl;
  float H=mix(my,mx,nx*nx)*1.5*(.85+.2*u_breath)*(1.+.3*u_charge)*(1.+.4*vw);
  float f=clamp(fn*1.15+.08+.1*vw+front*.5-dl/H*1.2,0.,1.);
  vec3 body=pal(.05,hs),tip=pal(.05,hs+.28);
  vec3 fc=mix(tip*.55,body,smoothstep(.1,.6,f));
  fc=mix(fc,mix(vec3(1.),body,.5),smoothstep(.72,1.,f));
  float fl=mix(.88+.12*h11(floor(t*18.)),.94,u_calm);
  vec3 fire=fc*smoothstep(0.,.22,f)*(.4+.6*smoothstep(.1,.75,f))*fl*(1.+.12*vw);
  vec3 col=mix(slab,vec3(.012,.008,.02)+fire,smoothstep(0.,1.5,dl));
  gl_FragColor=vec4(col,1.);
}`;
const sc=$('#slab');
let gl=null,SW=0,SH=0,ri=0,SQ=1;const uL={},rip=new Float32Array(24);
try{gl=sc.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power'})}catch(e){}
if(gl){
  const mk=(type,src)=>{const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);return sh};
  const pr=gl.createProgram();
  gl.attachShader(pr,mk(gl.VERTEX_SHADER,VS));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))gl=null;
  else{
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
    for(const n of ['u_res','u_t','u_slab','u_rip','u_hue','u_charge','u_breath','u_calm','u_s','u_voice'])uL[n]=gl.getUniformLocation(pr,n);
  }
}
function fitSlab(){
  const r=sc.getBoundingClientRect(),q=SQ=Math.min(2,Math.max(1,(devicePixelRatio||1)*.8));   /* skarp nok til glatte flammer, men let nok til batteriet */
  SW=Math.max(2,Math.round(r.width*q));SH=Math.max(2,Math.round(r.height*q));
  sc.width=SW;sc.height=SH;if(gl)gl.viewport(0,0,SW,SH);
}
function slabDraw(){
  if(!gl||!SW)return;
  gl.uniform2f(uL.u_res,SW,SH);gl.uniform1f(uL.u_t,slabTime());
  gl.uniform4f(uL.u_slab,...slabRect());
  gl.uniform4fv(uL.u_rip,rip);gl.uniform1f(uL.u_hue,hue%360);gl.uniform1f(uL.u_charge,charge);
  gl.uniform1f(uL.u_breath,breath());gl.uniform1f(uL.u_calm,reduce?1:0);gl.uniform1f(uL.u_s,SQ);gl.uniform1f(uL.u_voice,voice);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function slabRipple(x,y){
  rip.set([x,y,slabTime(),1],ri*4);ri=(ri+1)%6;
  sfx.static();buzz([10,30,14]);
}
let sdn=null;
sc.addEventListener('pointerdown',e=>{sdn={x:e.clientX,y:e.clientY,mv:false}});
sc.addEventListener('pointermove',e=>{if(sdn&&Math.hypot(e.clientX-sdn.x,e.clientY-sdn.y)>12)sdn.mv=true});
sc.addEventListener('pointerup',e=>{
  if(sdn&&!sdn.mv){
    const r=sc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*SW,y=(e.clientY-r.top)/r.height*SH;
    const R=slabRect();if(x<R[0]||x>R[2]||y<R[1]||y>R[3])slabRipple(x,y);   /* kun uden for kvadratet */
  }
  sdn=null;
});
sc.addEventListener('pointercancel',()=>{sdn=null});

/* ---------- Start ---------- */
function layout(){W=fit(cv,cx);S=fit(sg,sx);fitFire();KW=fit(kc,kx);fitSlab();drawSigil()}
addEventListener('resize',layout);
layout();
requestAnimationFrame(frame);
})();
